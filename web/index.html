<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pi AI Lab</title><style>body{font-family:system-ui;margin:0;background:#101218;color:#eee}main{max-width:1000px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#191c24;border:1px solid #2a2e39;border-radius:12px;padding:16px}textarea,input{width:100%;box-sizing:border-box;background:#0c0e13;color:#eee;border:1px solid #343947;border-radius:8px;padding:10px}button{padding:10px 14px;border:0;border-radius:8px;margin-top:10px;cursor:pointer}.out{white-space:pre-wrap;background:#0c0e13;padding:14px;border-radius:8px;min-height:100px}</style></head><body><main><h1>Pi AI Lab</h1><div class="grid" id="stats"></div><h2>Models</h2><select id="model"></select><h2>Prompt</h2><textarea id="prompt" rows="5" placeholder="Ask your local model..."></textarea><br><button onclick="run()">Run inference</button><h2>Output</h2><div class="out" id="out">Ready.</div></main><script>
async function j(u,o){let r=await fetch(u,o);if(!r.ok)throw Error(await r.text());return r.json()}
async function refresh(){let s=await j('/api/v1/system');document.getElementById('stats').innerHTML=`<div class=card>CPU ${s.cpu_count} cores<br>Load ${s.load_average.map(x=>x.toFixed(2)).join(' / ')}</div><div class=card>RAM ${(s.memory_bytes.used/1e6).toFixed(0)} MB / ${(s.memory_bytes.total/1e6).toFixed(0)} MB</div><div class=card>Temp ${s.temperature_c==null?'n/a':s.temperature_c.toFixed(1)+'°C'}</div><div class=card>${s.machine}<br>${s.hostname}</div>`;let m=await j('/api/v1/models');document.getElementById('model').innerHTML=m.models.map(x=>`<option value="${x.path}">${x.name}</option>`).join('')||'<option>No GGUF models</option>'}
async function run(){try{document.getElementById('out').textContent='Queued...';let x=await j('/api/v1/inference',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({model:document.getElementById('model').value,prompt:document.getElementById('prompt').value,max_tokens:128})});let id=x.job_id;for(;;){await new Promise(r=>setTimeout(r,500));let q=await j('/api/v1/jobs/'+id);if(q.status==='completed'){document.getElementById('out').textContent=q.result.text;break}if(q.status==='failed'||q.status==='cancelled'){document.getElementById('out').textContent=q.error||q.status;break}}}catch(e){document.getElementById('out').textContent=e}}
refresh();setInterval(refresh,3000);
</script></body></html>
