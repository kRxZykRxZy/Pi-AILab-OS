<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <title>Pi AI Lab</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <button id="menu" class="icon" aria-label="Menu">☰</button>
      <div class="brand"><span class="dot"></span><strong>Pi AI Lab</strong></div>
      <button id="modelsBtn" class="icon" aria-label="Models">◉</button>
    </header>

    <section id="chat" class="chat">
      <div id="welcome" class="welcome">
        <div class="logo">π</div>
        <h1>What can I help with?</h1>
        <p>Run your local GGUF models privately on your Pi.</p>
        <div class="suggestions">
          <button data-prompt="Explain how Raspberry Pi works in simple terms.">Explain Raspberry Pi simply</button>
          <button data-prompt="Give me three useful Linux commands.">Useful Linux commands</button>
          <button data-prompt="Write a small C++ program that prints Hello World.">Write C++ code</button>
        </div>
      </div>
    </section>

    <section id="modelsPanel" class="panel hidden">
      <div class="panelHead"><h2>Models</h2><button id="closeModels" class="icon">×</button></div>
      <label class="upload">+ Add GGUF model<input id="upload" type="file" accept=".gguf" hidden></label>
      <div id="modelList" class="modelList"></div>
    </section>

    <form id="composer" class="composer">
      <textarea id="prompt" rows="1" placeholder="Message Pi AI Lab…" autocomplete="off"></textarea>
      <button id="send" class="send" type="submit" aria-label="Send">↑</button>
      <div class="meta"><span id="status">Connecting…</span><span id="modelName">No model loaded</span></div>
    </form>
  </main>
  <script src="/app.js"></script>
</body>
</html>
