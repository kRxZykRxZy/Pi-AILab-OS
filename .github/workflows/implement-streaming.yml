name: Pi-AI Lab CI

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-ci --parallel 2
      - name: Verify tokenizer and NEON source
        run: |
          grep -q 'correct_byte_encoder' src/inference_parallel.cpp
          grep -q 'encode_sentencepiece' src/inference_parallel.cpp
          ! grep -q 'x\[i+j\]=x\[i+j\]' src/inference_v4.cpp
      - name: Commit generated source changes if any
        run: |
          git diff --check
          git status --short
